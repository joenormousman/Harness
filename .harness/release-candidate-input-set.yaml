inputSet:
  name: Salesforce Release Candidate
  identifier: Salesforce_Release_Candidate
  orgIdentifier: default
  projectIdentifier: default_project
  pipeline:
    identifier: Salesforce_DX_Governed_Release
    properties:
      ci:
        codebase:
          repoName: <+input>
          build:
            type: branch
            spec:
              branch: main
    variables:
      - name: sourceDir
        value: force-app
      - name: sfCliVersion
        value: 2.143.6
      - name: validationInstanceUrl
        value: https://login.salesforce.com
      - name: sandboxInstanceUrl
        value: https://login.salesforce.com
      - name: productionInstanceUrl
        value: https://login.salesforce.com
      - name: deployToSandbox
        value: "true"
      - name: deployToProduction
        value: "true"
      - name: productionApproverGroup
        value: account._account_all_users
