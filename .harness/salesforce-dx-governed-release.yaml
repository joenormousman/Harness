pipeline:
  name: Salesforce DX Governed Release
  identifier: Salesforce_DX_Governed_Release
  projectIdentifier: default_project
  orgIdentifier: default
  tags:
    system: salesforce
    demo: interview
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: <+input>
        build: <+input>
  variables:
    - name: sourceDir
      type: String
      description: Salesforce DX package directory to validate and deploy.
      required: true
      value: force-app
    - name: sfCliVersion
      type: String
      description: Pinned Salesforce CLI version for reproducible builds.
      required: true
      value: 2.143.6
    - name: validationInstanceUrl
      type: String
      description: Login URL for the validation org.
      required: true
      value: https://test.salesforce.com
    - name: sandboxInstanceUrl
      type: String
      description: Login URL for the deploy sandbox org.
      required: true
      value: https://test.salesforce.com
    - name: productionInstanceUrl
      type: String
      description: Login URL for the production org.
      required: true
      value: https://login.salesforce.com
    - name: deployToSandbox
      type: String
      description: Set to true for release branches that should deploy to sandbox.
      required: true
      value: "true"
    - name: deployToProduction
      type: String
      description: Set to true for release candidates that should validate and wait for production approval.
      required: true
      value: "false"
    - name: productionApproverGroup
      type: String
      description: Harness user group allowed to approve production Salesforce releases.
      required: true
      value: account._account_all_users
  stages:
    - stage:
        name: Validate Pull Request
        identifier: Validate_PR
        description: Compile and validate Salesforce metadata against a non-production validation org.
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Salesforce CLI
                  identifier: Install_Salesforce_CLI
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLI_VERSION: <+pipeline.variables.sfCliVersion>
                    command: |-
                      bash scripts/install-salesforce-cli.sh
              - step:
                  type: Run
                  name: Check Salesforce Project
                  identifier: Check_Salesforce_Project
                  spec:
                    shell: Bash
                    command: |-
                      node scripts/check-salesforce-project.mjs
              - step:
                  type: Run
                  name: Authenticate Validation Org
                  identifier: Auth_Validation_Org
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLIENT_ID: <+secrets.getValue("sf_validation_client_id")>
                      SF_USERNAME: <+secrets.getValue("sf_validation_username")>
                      SF_JWT_KEY_BASE64: <+secrets.getValue("sf_validation_jwt_key_b64")>
                      SF_INSTANCE_URL: <+pipeline.variables.validationInstanceUrl>
                      SF_ORG_ALIAS: validation
                    command: |-
                      bash scripts/auth-salesforce-jwt.sh
              - step:
                  type: Run
                  name: Validate Metadata
                  identifier: Validate_Metadata
                  spec:
                    shell: Bash
                    envVariables:
                      TARGET_ORG: validation
                      SOURCE_DIR: <+pipeline.variables.sourceDir>
                      TEST_LEVEL: RunLocalTests
                      WAIT_MINUTES: "60"
                    command: |-
                      bash scripts/validate-metadata.sh
                      source deployment-validation.env
                      export VALIDATION_JOB_ID
                      export DEPLOY_STATUS
                      export DEPLOY_TESTS_TOTAL
                      export DEPLOY_TESTS_FAILED
                    outputVariables:
                      - name: VALIDATION_JOB_ID
                      - name: DEPLOY_STATUS
                      - name: DEPLOY_TESTS_TOTAL
                      - name: DEPLOY_TESTS_FAILED
        tags: {}
    - stage:
        name: Deploy Sandbox
        identifier: Deploy_Sandbox
        description: Deploy validated metadata into a release sandbox and run a smoke test.
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Salesforce CLI
                  identifier: Install_Salesforce_CLI
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLI_VERSION: <+pipeline.variables.sfCliVersion>
                    command: |-
                      bash scripts/install-salesforce-cli.sh
              - step:
                  type: Run
                  name: Authenticate Sandbox Org
                  identifier: Auth_Sandbox_Org
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLIENT_ID: <+secrets.getValue("sf_sandbox_client_id")>
                      SF_USERNAME: <+secrets.getValue("sf_sandbox_username")>
                      SF_JWT_KEY_BASE64: <+secrets.getValue("sf_sandbox_jwt_key_b64")>
                      SF_INSTANCE_URL: <+pipeline.variables.sandboxInstanceUrl>
                      SF_ORG_ALIAS: sandbox
                    command: |-
                      bash scripts/auth-salesforce-jwt.sh
              - step:
                  type: Run
                  name: Deploy Metadata
                  identifier: Deploy_Metadata
                  spec:
                    shell: Bash
                    envVariables:
                      TARGET_ORG: sandbox
                      SOURCE_DIR: <+pipeline.variables.sourceDir>
                      TEST_LEVEL: RunLocalTests
                      WAIT_MINUTES: "60"
                      DEPLOY_MODE: standard
                    command: |-
                      bash scripts/deploy-metadata.sh
              - step:
                  type: Run
                  name: Run Apex Smoke Test
                  identifier: Run_Apex_Smoke_Test
                  spec:
                    shell: Bash
                    envVariables:
                      TARGET_ORG: sandbox
                      TEST_CLASS: HarnessReleaseHealthTest
                      WAIT_MINUTES: "20"
                    command: |-
                      bash scripts/run-apex-smoke-test.sh
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deployToSandbox> == "true"
        tags: {}
    - stage:
        name: Validate Production
        identifier: Validate_Production
        description: Run a production check-only deployment and export the validated deployment job ID.
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Salesforce CLI
                  identifier: Install_Salesforce_CLI
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLI_VERSION: <+pipeline.variables.sfCliVersion>
                    command: |-
                      bash scripts/install-salesforce-cli.sh
              - step:
                  type: Run
                  name: Check Salesforce Project
                  identifier: Check_Salesforce_Project
                  spec:
                    shell: Bash
                    command: |-
                      node scripts/check-salesforce-project.mjs
              - step:
                  type: Run
                  name: Authenticate Production Org
                  identifier: Auth_Production_Org
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLIENT_ID: <+secrets.getValue("sf_prod_client_id")>
                      SF_USERNAME: <+secrets.getValue("sf_prod_username")>
                      SF_JWT_KEY_BASE64: <+secrets.getValue("sf_prod_jwt_key_b64")>
                      SF_INSTANCE_URL: <+pipeline.variables.productionInstanceUrl>
                      SF_ORG_ALIAS: production
                    command: |-
                      bash scripts/auth-salesforce-jwt.sh
              - step:
                  type: Run
                  name: Production Validation
                  identifier: Production_Validation
                  spec:
                    shell: Bash
                    envVariables:
                      TARGET_ORG: production
                      SOURCE_DIR: <+pipeline.variables.sourceDir>
                      TEST_LEVEL: RunLocalTests
                      WAIT_MINUTES: "120"
                    command: |-
                      bash scripts/validate-metadata.sh
                      source deployment-validation.env
                      export VALIDATION_JOB_ID
                      export DEPLOY_STATUS
                      export DEPLOY_TESTS_TOTAL
                      export DEPLOY_TESTS_FAILED
                    outputVariables:
                      - name: VALIDATION_JOB_ID
                      - name: DEPLOY_STATUS
                      - name: DEPLOY_TESTS_TOTAL
                      - name: DEPLOY_TESTS_FAILED
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deployToProduction> == "true"
        tags: {}
    - stage:
        name: Approve Production
        identifier: Approve_Production
        description: Human production gate with validation evidence in the approval message.
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve Salesforce Production Release
                  identifier: Approve_Salesforce_Production_Release
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Review the Salesforce production validation before approving quick deploy.

                      Pipeline: <+pipeline.name>
                      Execution: <+pipeline.executionId>
                      Commit: <+codebase.commitSha>
                      Production validation status: <+pipeline.stages.Validate_Production.spec.execution.steps.Production_Validation.output.outputVariables.DEPLOY_STATUS>
                      Production validation job ID: <+pipeline.stages.Validate_Production.spec.execution.steps.Production_Validation.output.outputVariables.VALIDATION_JOB_ID>
                      Apex tests run: <+pipeline.stages.Validate_Production.spec.execution.steps.Production_Validation.output.outputVariables.DEPLOY_TESTS_TOTAL>
                      Apex test failures: <+pipeline.stages.Validate_Production.spec.execution.steps.Production_Validation.output.outputVariables.DEPLOY_TESTS_FAILED>
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: true
                      userGroups:
                        - <+pipeline.variables.productionApproverGroup>
                    approverInputs: []
                    isAutoRejectEnabled: true
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deployToProduction> == "true"
        tags: {}
        failureStrategies: []
    - stage:
        name: Deploy Production
        identifier: Deploy_Production
        description: Quick deploy the already validated production deployment and run a smoke test.
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Salesforce CLI
                  identifier: Install_Salesforce_CLI
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLI_VERSION: <+pipeline.variables.sfCliVersion>
                    command: |-
                      bash scripts/install-salesforce-cli.sh
              - step:
                  type: Run
                  name: Authenticate Production Org
                  identifier: Auth_Production_Org
                  spec:
                    shell: Bash
                    envVariables:
                      SF_CLIENT_ID: <+secrets.getValue("sf_prod_client_id")>
                      SF_USERNAME: <+secrets.getValue("sf_prod_username")>
                      SF_JWT_KEY_BASE64: <+secrets.getValue("sf_prod_jwt_key_b64")>
                      SF_INSTANCE_URL: <+pipeline.variables.productionInstanceUrl>
                      SF_ORG_ALIAS: production
                    command: |-
                      bash scripts/auth-salesforce-jwt.sh
              - step:
                  type: Run
                  name: Quick Deploy Production
                  identifier: Quick_Deploy_Production
                  spec:
                    shell: Bash
                    envVariables:
                      TARGET_ORG: production
                      DEPLOY_MODE: quick
                      WAIT_MINUTES: "120"
                      VALIDATION_JOB_ID: <+pipeline.stages.Validate_Production.spec.execution.steps.Production_Validation.output.outputVariables.VALIDATION_JOB_ID>
                    command: |-
                      bash scripts/deploy-metadata.sh
              - step:
                  type: Run
                  name: Run Production Smoke Test
                  identifier: Run_Production_Smoke_Test
                  spec:
                    shell: Bash
                    envVariables:
                      TARGET_ORG: production
                      TEST_CLASS: HarnessReleaseHealthTest
                      WAIT_MINUTES: "20"
                    command: |-
                      bash scripts/run-apex-smoke-test.sh
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deployToProduction> == "true"
        tags: {}
